<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המרחב של לורה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9dcc7;--surface:#f8f0e1;--ink:#3a2316;--muted:#7d604b;--line:#cdb592;--accent:#7a4220;--c1:#7a4220;--c2:#6d7a45;--c3:#bf8636;--c4:#5a3a29;--c5:#a15a40;--c6:#a8915f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1410;--surface:#2a1c14;--ink:#f1e3cf;--muted:#b79c82;--line:#4a3426;--accent:#d9985f;--c1:#d9985f;--c2:#a3b374;--c3:#e3b361;--c4:#c79a7a;--c5:#d98a70;--c6:#cdb787;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1410;--surface:#2a1c14;--ink:#f1e3cf;--muted:#b79c82;--line:#4a3426;--accent:#d9985f;--c1:#d9985f;--c2:#a3b374;--c3:#e3b361;--c4:#c79a7a;--c5:#d98a70;--c6:#cdb787;color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Assistant",system-ui,sans-serif;font-size:17px;line-height:1.6}
main{max-width:1000px;margin:0 auto;padding:40px 22px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.date{color:var(--muted);font-size:15px}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;font-size:clamp(38px,8vw,72px);line-height:1.1;margin:10px 0 6px}
.sub{color:var(--muted);margin:0 0 36px;max-width:46ch}
.tools{display:flex;gap:8px}
button,input,textarea{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;border-inline-start:6px solid var(--tc,var(--accent));text-decoration:none;color:inherit;display:block;min-height:140px;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile h2{font-family:"Frank Ruhl Libre",serif;font-size:27px;margin:0 0 8px;padding-bottom:8px;border-bottom:2px dotted var(--line)}
.tile p{margin:0;color:var(--muted);font-size:15px}
.soon{display:inline-block;margin-top:10px;font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:0 10px}
.del{position:absolute;top:10px;left:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}
.del:hover{background:var(--bg)}
.add{border-style:dashed;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;cursor:pointer;border-inline-start-width:1px}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);padding:26px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(29,20,16,.6)}
dialog h3{font-family:"Frank Ruhl Libre",serif;font-size:26px;margin:0 0 14px}
label{display:block;font-size:15px;margin-bottom:12px;color:var(--muted)}
input{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.row{display:flex;gap:8px;justify-content:flex-start;margin-top:8px}
.empty{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="date" id="date"></div>
    <div class="tools">
      <button class="btn" id="theme" type="button">מצב תצוגה</button>
    </div>
  </div>
  <h1 id="hello">שלום, לורה</h1>
  <p class="sub">☕ הקפה מוכן, כל המערכות שלך על השולחן. מה פותחים היום?</p>

  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg">
  <h3>מערכת חדשה</h3>
  <label>שם המערכת<input id="fName" maxlength="30" placeholder="למשל: הזמנות"></label>
  <label>כתובת (קישור)<input id="fUrl" dir="ltr" placeholder="https://..."></label>
  <label>במילה או שתיים, מה היא עושה?<input id="fDesc" maxlength="60"></label>
  <div class="row">
    <button class="btn primary" id="save" type="button">הוספה</button>
    <button class="btn" id="cancel" type="button">ביטול</button>
  </div>
</dialog>

<script>
var KEY="laura-systems-v2";var editIdx=-1;
var colors=["--c1","--c2","--c3","--c4","--c5","--c6"];
var defaults=[
 {n:"בדרך למפתחות",u:"keys.html",d:"מעקב הוצאות וחיסכון לחזון הדירה"},
 {n:"הפינה של בן",u:"mezonot.html",d:"ההוצאות שלו והמזונות, במקום אחד"}
];
var items;
try{var s=localStorage.getItem(KEY);items=s?JSON.parse(s):null}catch(e){items=null}
if(!Array.isArray(items))items=defaults.slice();
items.forEach(function(it){if(!it.u&&it.n==="בדרך למפתחות")it.u="keys.html";if(!it.u&&it.n==="הפינה של בן")it.u="mezonot.html"});
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
var grid=document.getElementById("grid");
function render(){
  grid.innerHTML="";
  items.forEach(function(it,i){
    var el=document.createElement(it.u?"a":"div");
    el.className="tile";
    el.style.setProperty("--tc","var("+colors[i%colors.length]+")");
    if(it.u){el.href=it.u;el.target="_blank";el.rel="noopener"}
    var h=document.createElement("h2");h.textContent=it.n;el.appendChild(h);
    var p=document.createElement("p");p.textContent=it.d||"";el.appendChild(p);
    if(!it.u){var b=document.createElement("span");b.className="soon";b.textContent="הוסיפי קישור";el.appendChild(b);el.style.cursor="pointer";el.tabIndex=0;el.setAttribute("role","button");el.onclick=function(){openEdit(i)};el.onkeydown=function(ev){if(ev.key==="Enter")openEdit(i)}}
    var x=document.createElement("button");x.className="del";x.type="button";x.setAttribute("aria-label","הסרת "+it.n);x.textContent="×";
    x.onclick=function(ev){ev.preventDefault();ev.stopPropagation();items.splice(i,1);persist();render()};
    el.appendChild(x);
    grid.appendChild(el);
  });
  var add=document.createElement("button");add.type="button";add.className="tile add";add.textContent="+ הוספת מערכת";
  add.onclick=function(){editIdx=-1;dlg.querySelector("h3").textContent="מערכת חדשה";dlg.showModal();document.getElementById("fName").focus()};
  grid.appendChild(add);
}
var dlg=document.getElementById("dlg");
function openEdit(i){editIdx=i;var it=items[i];dlg.querySelector("h3").textContent="קישור ל"+it.n;document.getElementById("fName").value=it.n;document.getElementById("fUrl").value=it.u||"";document.getElementById("fDesc").value=it.d||"";dlg.showModal();document.getElementById("fUrl").focus()}
document.getElementById("cancel").onclick=function(){dlg.close()};
document.getElementById("save").onclick=function(){
  var n=document.getElementById("fName").value.trim();
  var u=document.getElementById("fUrl").value.trim();
  var d=document.getElementById("fDesc").value.trim();
  if(!n)return;
  if(u&&!/^https?:\/\//i.test(u))u="https://"+u;
  if(editIdx>=0){items[editIdx]={n:n,u:u,d:d}}else{items.push({n:n,u:u,d:d})}editIdx=-1;persist();render();
  ["fName","fUrl","fDesc"].forEach(function(id){document.getElementById(id).value=""});
  dlg.close();
};
var now=new Date(),hr=now.getHours();
var g=hr<5?"לילה טוב":hr<12?"בוקר טוב":hr<17?"צהריים טובים":hr<21?"ערב טוב":"לילה טוב";
document.getElementById("hello").textContent=g+", לורה";
document.getElementById("date").textContent=now.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"});
document.getElementById("theme").onclick=function(){
  var r=document.documentElement,dark=r.getAttribute("data-theme")?r.getAttribute("data-theme")==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.setAttribute("data-theme",dark?"light":"dark");
};
render();
</script>
</body>
</html>
