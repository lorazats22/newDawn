<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעקב חשבונות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e9dc;--surface:#fbf6ee;--ink:#3b2a20;--muted:#7d6556;--line:#e0d0bd;--accent:#6f4a32;--accent-ink:#fbf6ee;--caramel:#c98a4b;--bar:#8b5e3c;--bar2:#d9b88f;
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1510;--surface:#2a1d16;--ink:#f1e3d3;--muted:#b49a86;--line:#42302440;--accent:#d3a272;--accent-ink:#1e1510;--caramel:#e0a35f;--bar:#c48b5a;--bar2:#5a4030;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1510;--surface:#2a1d16;--ink:#f1e3d3;--muted:#b49a86;--line:#4a3628;--accent:#d3a272;--accent-ink:#1e1510;--caramel:#e0a35f;--bar:#c48b5a;--bar2:#5a4030;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Heebo,system-ui,sans-serif}
h1,h2{font-family:'Frank Ruhl Libre',Georgia,serif;margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 8px;max-width:1100px;margin:auto}
h1{font-size:30px}
h2{font-size:20px;margin-bottom:12px}
button,input,select{font:inherit;color:inherit}
.theme{background:none;border:1px solid var(--line);border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--muted)}
nav{display:flex;gap:8px;padding:8px 24px 16px;max-width:1100px;margin:auto;overflow-x:auto}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:8px 16px;cursor:pointer}
nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
nav .add{border-style:dashed;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:20px;padding:0 24px 40px;max-width:1100px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px}
.col{min-width:0}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
input,select{width:100%;margin-top:4px;padding:9px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus-visible,button:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px;font-weight:700;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-family:'Frank Ruhl Libre',serif}
.stat span{font-size:13px;color:var(--muted)}
.up{color:#b5472f}.down{color:#4f7a3f}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{border:0;background:none;color:var(--muted);padding:4px 10px;border-radius:14px;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--ink);font-weight:700}
svg{width:100%;height:auto;display:block}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .grow{flex:1}
li small{color:var(--muted);display:block}
li.done .t{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px}
.tadd{display:grid;grid-template-columns:1fr 140px auto;gap:8px;margin-bottom:10px}
.tadd button{background:var(--caramel);color:#2a1d16;border:0;border-radius:8px;padding:0 14px;font-weight:700;cursor:pointer}
.empty{color:var(--muted);padding:8px 0}
.scroll{overflow-x:auto}
header{gap:12px;flex-wrap:wrap}
.sw{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:3px}
.sw button{border:0;background:none;border-radius:18px;padding:6px 18px;cursor:pointer;color:var(--muted)}
.sw button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
#fStats{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:8px}.ch h2{margin:0;flex:1}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 8px;font-size:13px;color:var(--muted);margin-inline-end:6px}
.mini{display:flex;gap:8px;margin-top:10px}.mini button{flex:1;background:none;border:1px dashed var(--line);border-radius:8px;padding:6px;color:var(--muted);cursor:pointer}
.sub{font-size:14px;color:var(--muted);margin:14px 0 4px}
.xtadd{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}
.xtadd button{background:var(--caramel);color:#2a1d16;border:0;border-radius:8px;padding:0 14px;font-weight:700;cursor:pointer}
.xnote{width:100%;margin-top:4px;padding:9px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;resize:vertical;min-height:64px;font:inherit;color:inherit}
.xnote:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
</style>
</head>
<body>
<header><h1>☕ מעקב חשבונות</h1><div class="sw"><button data-v="var" class="on">משתנים</button><button data-v="fix">קבועים</button></div><button class="theme" id="theme">מצב כהה / בהיר</button></header>
<div id="varView"><nav id="nav"></nav>
<main>
 <section class="col">
  <div class="card"><h2 id="fTitle"></h2>
   <form id="form" onsubmit="return false">
    <div class="row"><label>חודש<input type="month" id="fm" required></label>
    <label>סכום (₪)<input type="number" id="fa" step="0.01" min="0" required></label></div>
    <label><span id="fuL">צריכה</span><input type="number" id="fu" step="0.01" min="0"></label>
    <label>הערה<input id="fn" maxlength="80"></label>
    <button class="primary" id="save">שמירת חשבון</button>
   </form></div>
  <div class="card"><h2>היסטוריה</h2><div id="hist"></div></div>
 </section>
 <section class="col">
  <div class="card"><div class="ch"><h2 id="dTitle"></h2><button class="theme" data-tdelx="1">מחיקת סוג חשבון</button></div><div class="stats" id="stats"></div>
   <div class="tabs"><button data-m="amount" class="on">סכום</button><button data-m="usage">צריכה</button></div>
   <div class="scroll"><div id="chart"></div></div></div>
  <div class="card"><h2 id="tTitle"></h2>
   <div class="tadd"><input id="tt" placeholder="למשל: לבדוק את המונה"><input type="date" id="td" aria-label="תאריך יעד"><button id="tb">הוספה</button></div>
   <ul id="tasks"></ul></div>
 </section>
</main></div>
<div id="fixView" hidden><main>
 <section class="col"><div class="card"><h2>הוספת חשבון קבוע</h2>
  <label>שם<input id="xn" maxlength="50" placeholder="למשל: ביטוח בריאות"></label>
  <div class="row"><label>סכום חודשי (₪)<input type="number" id="xa" min="0" step="0.01"></label><label>יום חיוב<input type="number" id="xd" min="1" max="31"></label></div>
  <div class="row"><label>עבור מי<select id="xw"></select></label><label>קטגוריה<select id="xc"></select></label></div>
  <button class="primary" id="xs">הוספת חשבון</button>
  <div class="mini"><button id="addCat">+ קטגוריה</button><button id="addWho">+ אדם</button></div></div></section>
 <section class="col"><div class="stats" id="fStats"></div><div id="fCats"></div></section>
</main></div>
<script>
const KEY='bills-v1';
const DEF={cur:'water',types:[{id:'water',name:'מים',unit:'מ"ק',icon:'💧'},{id:'elec',name:'חשמל',unit:'קוט"ש',icon:'⚡'},{id:'gas',name:'גז',unit:'מ"ק',icon:'🔥'},{id:'tax',name:'ארנונה',unit:'',icon:'🏠'},{id:'net',name:'אינטרנט',unit:'',icon:'📶'}],bills:{},tasks:{}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||DEF}catch(e){S=DEF}
let metric='amount';
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cur=()=>S.types.find(t=>t.id===S.cur)||S.types[0];
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>Number(n).toLocaleString('he-IL',{maximumFractionDigits:1});
const lbl=m=>m.slice(5)+'/'+m.slice(2,4);
function bills(){return (S.bills[cur().id]||[]).slice().sort((a,b)=>a.month.localeCompare(b.month))}
function render(){
 const t=cur();
 $('nav').innerHTML=S.types.map(x=>`<button class="${x.id===t.id?'on':''}" data-t="${x.id}">${x.icon} ${esc(x.name)}</button>`).join('')+'<button class="add" data-add="1">+ סוג חשבון</button>';
 $('fTitle').textContent='הזנת חשבון '+t.name;
 $('dTitle').textContent='מגמות – '+t.name;
 $('tTitle').textContent='משימות – '+t.name;
 $('fuL').textContent='צריכה'+(t.unit?' ('+t.unit+')':'');
 const b=bills();
 $('hist').innerHTML=b.length?'<ul>'+b.slice().reverse().map(x=>`<li><div class="grow"><b>${lbl(x.month)}</b> · ₪${fmt(x.amount)}${x.usage!==''&&x.usage!=null?' · '+fmt(x.usage)+' '+esc(t.unit):''}${x.note?`<small>${esc(x.note)}</small>`:''}</div><button class="x" data-del="${x.id}" aria-label="מחיקה">×</button></li>`).join('')+'</ul>':'<div class="empty">עוד אין חשבונות. הוסיפי את הראשון בטופס.</div>';
 stats(b);chart(b);tasks();renderFixed();
}
function stats(b){
 if(!b.length){$('stats').innerHTML='<div class="empty">הנתונים יופיעו כאן אחרי ההזנה הראשונה.</div>';return}
 const l=b[b.length-1],p=b[b.length-2],avg=b.reduce((s,x)=>s+x.amount,0)/b.length;
 let ch='—';if(p&&p.amount){const d=(l.amount-p.amount)/p.amount*100;ch=`<span class="${d>0?'up':'down'}">${d>0?'▲':'▼'} ${fmt(Math.abs(d))}%</span>`}
 $('stats').innerHTML=`<div class="stat"><b>₪${fmt(l.amount)}</b><span>חשבון אחרון</span></div><div class="stat"><b>₪${fmt(avg)}</b><span>ממוצע חודשי</span></div><div class="stat"><b>${ch}</b><span>מול החודש הקודם</span></div>`;
}
function chart(b){
 const k=metric,d=b.filter(x=>x[k]!==''&&x[k]!=null).slice(-12);
 if(!d.length){$('chart').innerHTML='<div class="empty">אין עדיין נתונים להצגה.</div>';return}
 const W=Math.max(480,d.length*52),H=210,pb=28,pt=22,max=Math.max(...d.map(x=>+x[k]))||1,bw=Math.min(34,W/d.length-14);
 const step=W/d.length;let s=`<svg viewBox="0 0 ${W} ${H}" dir="ltr" role="img" aria-label="גרף מגמות">`;
 s+=`<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>`;
 let pts=[];
 d.forEach((x,i)=>{const h=(H-pb-pt)*(+x[k]/max),cx=step*i+step/2,y=H-pb-h;
  s+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${i===d.length-1?'var(--bar)':'var(--bar2)'}"/>`;
  s+=`<text x="${cx}" y="${y-6}" text-anchor="middle" font-size="11" fill="var(--ink)">${fmt(x[k])}</text>`;
  s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${lbl(x.month)}</text>`;
  pts.push(`${cx},${y}`)});
 if(d.length>1)s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(--caramel)" stroke-width="2.5" stroke-linecap="round"/>`;
 $('chart').innerHTML=s+'</svg>';
}
function tasks(){
 const a=(S.tasks[cur().id]||[]).slice().sort((x,y)=>x.done-y.done);
 $('tasks').innerHTML=a.length?a.map(x=>`<li class="${x.done?'done':''}"><input type="checkbox" style="width:auto;margin:0" data-chk="${x.id}" ${x.done?'checked':''} aria-label="בוצע"><div class="grow t">${esc(x.text)}${x.due?`<small>עד ${x.due.split('-').reverse().join('/')}</small>`:''}</div><button class="x" data-tdel="${x.id}" aria-label="מחיקה">×</button></li>`).join(''):'<div class="empty">אין משימות לחשבון הזה.</div>';
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t],[data-add],[data-del],[data-m],[data-tdel],[data-tdelx]');if(!t)return;
 const d=t.dataset;
 if(d.t){S.cur=d.t}
 else if(d.add){const n=prompt('שם סוג החשבון (למשל: ועד בית)');if(!n||!n.trim())return;const u=prompt('יחידת צריכה (לא חובה)')||'';const id=uid();S.types.push({id,name:n.trim(),unit:u.trim(),icon:'🧾'});S.cur=id}
 else if(d.del){S.bills[cur().id]=(S.bills[cur().id]||[]).filter(x=>x.id!==d.del)}
 else if(d.m){metric=d.m;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===t))}
 else if(d.tdel){S.tasks[cur().id]=S.tasks[cur().id].filter(x=>x.id!==d.tdel)}
 else if(d.tdelx){const y=cur(),n=(S.bills[y.id]||[]).length;if(S.types.length<2){alert('חייב להישאר לפחות סוג חשבון אחד');return}if(!confirm('למחוק את "'+y.name+'" עם '+n+' חשבונות והמשימות שלו?'))return;S.types=S.types.filter(x=>x.id!==y.id);delete S.bills[y.id];delete S.tasks[y.id];S.cur=S.types[0].id}
 save();render();
});
document.addEventListener('change',e=>{const c=e.target.dataset.chk;if(!c)return;const x=S.tasks[cur().id].find(y=>y.id===c);x.done=e.target.checked;save();render()});
$('save').onclick=()=>{
 const f=$('form');if(!f.reportValidity())return;
 const id=cur().id,m=$('fm').value,list=S.bills[id]=S.bills[id]||[];
 const rec={id:uid(),month:m,amount:+$('fa').value,usage:$('fu').value===''?'':+$('fu').value,note:$('fn').value.trim()};
 const i=list.findIndex(x=>x.month===m);if(i>-1)list[i]=rec;else list.push(rec);
 f.reset();save();render();
};
$('tb').onclick=()=>{const v=$('tt').value.trim();if(!v)return;const id=cur().id;(S.tasks[id]=S.tasks[id]||[]).push({id:uid(),text:v,due:$('td').value,done:false});$('tt').value='';$('td').value='';save();render()};
$('tt').addEventListener('keydown',e=>{if(e.key==='Enter')$('tb').click()});
$('theme').onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).colorScheme==='dark';r.dataset.theme=dark?'light':'dark'};
S.fixed=S.fixed||{cats:[{id:'ins',name:'ביטוחים',icon:'🛡️'},{id:'hobby',name:'חוגים',icon:'🎨'},{id:'sub',name:'מנויים',icon:'📺'},{id:'home',name:'דיור',icon:'🏠'}],people:['אני','הילד'],items:[],tasks:{}};
function renderFixed(){
 const F=S.fixed,w=$('xw').value,c=$('xc').value;
 $('xw').innerHTML=F.people.map(p=>`<option>${esc(p)}</option>`).join('');
 $('xc').innerHTML=F.cats.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
 if(F.people.includes(w))$('xw').value=w;if(F.cats.some(x=>x.id===c))$('xc').value=c;
 const sum=a=>a.reduce((s,x)=>s+x.amount,0);
 $('fStats').innerHTML=`<div class="stat"><b>₪${fmt(sum(F.items))}</b><span>סה"כ לחודש</span></div>`+F.people.map(p=>`<div class="stat"><b>₪${fmt(sum(F.items.filter(x=>x.who===p)))}</b><span>${esc(p)}</span></div>`).join('');
 $('fCats').innerHTML=F.cats.map(c=>{
  const it=F.items.filter(x=>x.cat===c.id).sort((a,b)=>(+a.day||99)-(+b.day||99)),ts=(F.tasks[c.id]||[]).slice().sort((a,b)=>a.done-b.done);
  return `<div class="card"><div class="ch"><h2>${c.icon} ${esc(c.name)}</h2><b>₪${fmt(sum(it))}</b><button class="x" data-xcdel="${c.id}" aria-label="מחיקת קטגוריה">×</button></div>`
  +(it.length?'<ul>'+it.map(x=>`<li><div class="grow"><b>${esc(x.name)}</b><small><span class="pill">${esc(x.who)}</span>${x.day?'כל '+x.day+' בחודש':''}</small></div><span>₪${fmt(x.amount)}</span><button class="x" data-xdel="${x.id}" aria-label="מחיקה">×</button></li>`).join('')+'</ul>':'<div class="empty">אין עדיין חשבונות בקטגוריה.</div>')
  +`<div class="sub">משימות</div><div class="xtadd"><input class="xti" placeholder="משימה חדשה"><button data-xtadd="${c.id}">הוספה</button></div><ul>`
  +ts.map(t=>`<li class="${t.done?'done':''}"><input type="checkbox" style="width:auto;margin:0" data-xchk="${c.id}|${t.id}" ${t.done?'checked':''} aria-label="בוצע"><div class="grow t">${esc(t.text)}</div><button class="x" data-xtdel="${c.id}|${t.id}" aria-label="מחיקה">×</button></li>`).join('')+`</ul><div class="sub">הערות</div><textarea class="xnote" data-xnote="${c.id}" rows="2" placeholder="אפשר לכתוב כאן כל דבר: מספרי פוליסה, אנשי קשר, תנאים…" aria-label="הערות לקטגוריה ${esc(c.name)}">${esc((F.notes||{})[c.id]||'')}</textarea></div>`;
 }).join('')||'<div class="card empty">הוסיפי קטגוריה כדי להתחיל.</div>';
}
function addTask(btn){const i=btn.closest('.card').querySelector('.xti'),v=i.value.trim();if(!v)return;const k=btn.dataset.xtadd;(S.fixed.tasks[k]=S.fixed.tasks[k]||[]).push({id:uid(),text:v,done:false});save();render()}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-v],[data-xdel],[data-xcdel],[data-xtadd],[data-xtdel]');if(!t)return;const d=t.dataset,F=S.fixed;
 if(d.v){$('varView').hidden=d.v!=='var';$('fixView').hidden=d.v!=='fix';document.querySelectorAll('.sw button').forEach(x=>x.classList.toggle('on',x===t));return}
 if(d.xdel)F.items=F.items.filter(x=>x.id!==d.xdel);
 else if(d.xcdel){const n=F.items.filter(x=>x.cat===d.xcdel).length;if(n&&!confirm('למחוק את הקטגוריה ואת '+n+' החשבונות שבה?'))return;F.cats=F.cats.filter(x=>x.id!==d.xcdel);F.items=F.items.filter(x=>x.cat!==d.xcdel);delete F.tasks[d.xcdel];delete (F.notes||{})[d.xcdel]}
 else if(d.xtadd){addTask(t);return}
 else if(d.xtdel){const[c,i]=d.xtdel.split('|');F.tasks[c]=F.tasks[c].filter(x=>x.id!==i)}
 save();render();
});
document.addEventListener('change',e=>{const k=e.target.dataset.xchk;if(!k)return;const[c,i]=k.split('|');S.fixed.tasks[c].find(x=>x.id===i).done=e.target.checked;save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('xti'))addTask(e.target.nextElementSibling)});
document.addEventListener('input',e=>{const k=e.target.dataset.xnote;if(!k)return;S.fixed.notes=S.fixed.notes||{};S.fixed.notes[k]=e.target.value;save()});
$('xs').onclick=()=>{const n=$('xn').value.trim(),a=$('xa').value;if(!$('xc').value){alert('קודם מוסיפים קטגוריה');return}if(!n||a===''){$('xn').focus();return}S.fixed.items.push({id:uid(),cat:$('xc').value,name:n,who:$('xw').value,amount:+a,day:$('xd').value});$('xn').value=$('xa').value=$('xd').value='';save();render()};
$('addCat').onclick=()=>{const n=prompt('שם הקטגוריה (למשל: רכב)');if(!n||!n.trim())return;S.fixed.cats.push({id:uid(),name:n.trim(),icon:'📁'});save();render()};
$('addWho').onclick=()=>{const n=prompt('שם האדם (למשל: בן/בת זוג)');if(!n||!n.trim()||S.fixed.people.includes(n.trim()))return;S.fixed.people.push(n.trim());save();render()};
render();
</script>
</body>
</html>
